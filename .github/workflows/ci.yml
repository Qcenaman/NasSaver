name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk NasSaver.apk
      - uses: actions/upload-artifact@v4
        with: { name: "NasSaver-${{ github.sha }}", path: NasSaver.apk, retention-days: 30 }
      # A new versionName pushed to main is tagged v<versionName> and released with the commit message as notes.
      # A pushed v* tag (or a release made on GitHub) gets the APK too, with the tag message or existing notes.
      - name: Release the APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then gh release upload "$TAG" NasSaver.apk --clobber; fi
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          else
            git log -1 --format=%B | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > notes.md
          fi
          gh release create "$TAG" NasSaver.apk --target "$GITHUB_SHA" --title "NasSaver $TAG" --notes-file notes.md
