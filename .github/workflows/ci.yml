name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk NasSaver.apk
      - uses: actions/upload-artifact@v4
        with: { name: NasSaver-${{ github.sha }}, path: NasSaver.apk, retention-days: 30 }
      - name: Release the APK (keeps the notes of an existing release, else uses the tag message)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NasSaver.apk --clobber
          else
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
            gh release create "$TAG" NasSaver.apk --title "NasSaver $TAG" --notes-file notes.md
          fi
