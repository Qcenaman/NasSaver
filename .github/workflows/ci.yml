name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk NasSaver.apk
      - uses: actions/upload-artifact@v4
        with: { name: NasSaver-${{ github.sha }}, path: NasSaver.apk, retention-days: 30 }
      - name: Release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "${GITHUB_REF}:${GITHUB_REF}"
          git for-each-ref "${GITHUB_REF}" --format='%(contents)' > notes.md
          cat notes.md
      - name: Release the APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NasSaver ${{ github.ref_name }}
          body_path: notes.md
          files: NasSaver.apk
          fail_on_unmatched_files: true
